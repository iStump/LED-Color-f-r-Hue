# Prüft bei jeder Änderung automatisch, ob die Integration für HACS und
# Home Assistant korrekt aufgebaut ist (grüner Haken = alles gut).
name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Nur für den öffentlichen HACS-Store nötig – LED Color wird bewusst
          # nicht öffentlich gelistet, darum ausgelassen.
          ignore: brands description topics
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
